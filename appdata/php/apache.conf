ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    # Front controller: semua URL yang bukan berkas nyata diarahkan ke index.php
    FallbackResource /index.php
</Directory>

# Folder unggahan tidak boleh mengeksekusi skrip
<Directory /var/www/html/public/uploads>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
